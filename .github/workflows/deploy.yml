name: Deploy Ismobot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      DEPLOY_DIR: /opt/ismobot
      SERVICE_NAME: ismobot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required deployment secrets
        id: check_secrets
        run: |
          missing=()
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN SSH_HOST SSH_USERNAME SSH_PASSWORD; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Skipping deploy because required secrets are missing: ${missing[*]}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Authenticate Cloudflare Wrangler
        if: steps.check_secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: whoami

      - name: Install SSH tools
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass curl lsb-release

      - name: Install cloudflared
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            | sudo tee /usr/share/keyrings/cloudflare-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-archive-keyring.gpg] https://pkg.cloudflare.com/cloudflared $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update
          sudo apt-get install -y cloudflared

      - name: Configure SSH over Cloudflare
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/config <<EOF
          Host ${SSH_HOST}
            HostName ${SSH_HOST}
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy on server
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          sshpass -p "${SSH_PASSWORD}" ssh "${SSH_USERNAME}@${SSH_HOST}" "
            set -euo pipefail

            cd '${DEPLOY_DIR}'

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            if [ ! -d venv ]; then
              python3 -m venv venv
            fi

            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            if [ -f alembic.ini ]; then
              ./venv/bin/alembic upgrade head
            fi

            sudo systemctl restart '${SERVICE_NAME}'
            sudo systemctl is-active --quiet '${SERVICE_NAME}'
          "
